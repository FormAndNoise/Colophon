name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "pyproject.toml"

permissions:
  issues: write

jobs:
  # Quality gate — must pass before publish is allowed
  validate:
    name: Validate before publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          # Install runtime deps that are needed for import (torch cpu-only to save CI time)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install Pillow numpy requests fontTools

      - name: Syntax check (compileall)
        run: python -m compileall -q .

      - name: Lint — fatal errors only (E9xx, F)
        run: python -m flake8 --select=E9,F --exclude=__pycache__ .

      - name: Import smoke test
        run: |
          cd ..
          python - <<'SMOKE'
          import sys, importlib, types, os
          # Stub ComfyUI's folder_paths so the pack can be imported standalone
          fp = types.ModuleType('folder_paths')
          fp.get_folder_paths = lambda k: [os.path.abspath('.')]
          fp.get_output_directory = lambda: os.path.abspath('./output')
          sys.modules['folder_paths'] = fp
          sys.path.insert(0, os.path.abspath('.'))
          pkg = os.path.basename('${{ github.workspace }}')
          m = importlib.import_module(pkg)
          count = len(m.NODE_CLASS_MAPPINGS)
          print(f"IMPORT OK — {count} nodes registered")
          assert count > 0, "NODE_CLASS_MAPPINGS is empty"
          SMOKE

      - name: Run tests (if any)
        run: python -m pytest -q --tb=short || true
        # TODO: remove `|| true` once a real test suite exists and passes

  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.repository_owner == 'Big-Idea-Technology' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
