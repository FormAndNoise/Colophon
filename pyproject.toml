[project]
name = "comfyui-book-tools"
description = "MiniBook Studio — a ComfyUI custom-node suite for AI-assisted book creation. Includes LLM-driven editorial planning, layout composition, front-matter generation, text-to-image rendering, and legacy BookTools text-overlay nodes."
version = "1.2"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch",
    "Pillow",
    "numpy",
    "requests",
    "fontTools",
]

[project.urls]
Repository = "https://github.com/Big-Idea-Technology/ComfyUI-Book-Tools"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "nazgut"
DisplayName = "ComfyUI-Book-Tools"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
addopts = "--ignore=__init__.py"

[tool.flake8]
max-line-length = 120
exclude = ["__pycache__", ".worktrees"]
